<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<title>Get Tide — Contraction Timer</title>
<meta property="og:title" content="Tide — Contraction Timer">
<meta property="og:description" content="A calm companion for labor. One tap to time contractions; a private link keeps family updated.">
<meta property="og:image" content="https://live.katiep.me/app-preview.png">
<meta property="og:url" content="https://live.katiep.me/app">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://live.katiep.me/app-preview.png">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; }
  body { min-height:100vh; font-family:-apple-system,"Quicksand",system-ui,"Segoe UI",Roboto,sans-serif;
    background:#FAF8F5; color:#5A4E45; }

  #iab { display:none; }
  /* Static arrow sweeping up from underneath, tip pointing up-right at the ••• . */
  .arrow { position:fixed; top:6px; right:34px; z-index:30; width:120px; height:120px; pointer-events:none; }

  .wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 40px) 26px calc(env(safe-area-inset-bottom) + 34px); }

  .brand { text-align:center; }
  .brand .wave { font-size:60px; font-weight:800; letter-spacing:-3px; color:#E68F44; line-height:1; }
  .brand .tag { font-size:18px; font-weight:600; color:#6B564D; margin-top:6px; }

  .huge { display:none; width:100%; max-width:360px; text-align:left; }
  .title { font-size:27px; font-weight:800; letter-spacing:-.02em; color:#5A4E45; margin-bottom:26px; line-height:1.1; }
  .title .tide { color:#E68F44; }
  .huge .step { font-size:23px; font-weight:500; line-height:1.22; color:#5A4E45; margin:0 0 14px; }
  .huge .step .dots { font-weight:800; color:#5A4E45; letter-spacing:1px; }
  .huge .step .ext  { font-weight:800; color:#5A4E45; }
  .huge .then { font-size:17px; font-weight:500; color:#B0A392; margin:16px 0; }
  .huge .foot { font-size:16px; font-weight:500; color:#A2917F; margin-top:30px; line-height:1.5; }
</style>
</head>
<body>
  <div id="iab">
    <svg class="arrow" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M16 106 C 18 50, 60 40, 104 8" stroke="#E68F44" stroke-width="5" stroke-linecap="round"/>
      <path d="M82 10 L 104 8 L 95 28" stroke="#E68F44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="wrap">
    <div class="brand" id="brand">
      <div class="wave">Tide</div>
      <div class="tag">A calm companion for labor.</div>
    </div>

    <div class="huge" id="huge">
      <div class="step">1. Tap <span class="dots">•••</span></div>
      <div class="step">2. Tap <span class="ext">Open in external browser</span></div>
    </div>
  </div>

<script>
  var web = "https://apps.apple.com/app/id6795967947";
  var ua  = navigator.userAgent || "";
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Messenger|Line|Snapchat|Pinterest/i.test(ua);
  var preview = /[?&]preview=1/.test(location.search);
  try { navigator.sendBeacon("https://flvshacazleoplaetyab.functions.supabase.co/track?p=app"); } catch (e) {}
  if (inApp || preview) {
    document.getElementById("iab").style.display = "block";
    document.getElementById("huge").style.display = "block";
    document.getElementById("brand").style.display = "none";
    if (!preview) setTimeout(function () { try { window.location.href = "x-safari-" + web; } catch (e) {} }, 250);
  } else {
    setTimeout(function () { window.location.href = web; }, 350);
  }
</script>
</body>
</html>
